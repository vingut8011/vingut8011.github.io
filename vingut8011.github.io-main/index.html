<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<label>
    <input type="checkbox" id="darkModeToggle">
    Dark Mode
</label>

<header>
    <h1>Vincent Gutierrez Portfolio</h1>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
</nav>

<section id="about">
    <h2>About Me</h2>
    <p>This is my portfolio page.</p>

    <h3>Skills</h3>
    <ul id="skillsList"></ul>
</section>

<section id="featured">
    <h2>Featured Content</h2>

    <div id="universityResources">
        <h3>University Resources</h3>
        <p><a href="https://www.ecpi.edu/" target="_blank">ECPI Program Home Page</a></p>
    </div>

    <div id="personalProjects">
        <h3>Personal Projects</h3>
        <a href="https://github.com/" target="_blank">
            <img src="https://via.placeholder.com/150" alt="Project">
        </a>
    </div>
</section>

<section id="projects">
    <h2>Projects</h2>
    <div class="project">Project 1</div>
    <div class="project">Project 2</div>
</section>

<section id="contact">
    <h2>Contact</h2>
    <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name">
        <br><br>
        <textarea id="message" placeholder="Message"></textarea>
        <br><br>
        <button type="submit">Submit</button>
    </form>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const projects = document.querySelectorAll(".project");
    const universityResources = document.getElementById("universityResources");
    const personalProjects = document.getElementById("personalProjects");

    if (projects.length < 3) {
        universityResources.style.display = "block";
        personalProjects.style.display = "block";
    } else {
        universityResources.style.display = "none";
        personalProjects.style.display = "block";
    }

    const skills = ["HTML", "CSS", "JavaScript", "Git", "GitHub"];
    const skillsList = document.getElementById("skillsList");

    for (let i = 0; i < skills.length; i++) {
        const li = document.createElement("li");
        li.textContent = skills[i];
        skillsList.appendChild(li);
    }

    const toggle = document.getElementById("darkModeToggle");
    toggle.addEventListener("change", function () {
        document.body.classList.toggle("dark-mode");
    });

    const form = document.getElementById("contactForm");
    const nameInput = document.getElementById("name");

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        alert("Thank you, " + nameInput.value + ", your message has been sent!");
    });
});
</script>

</body>
</html>
